# bubblewrap 沙箱策略 — 每行一个规则
# 格式: <动作> <参数...>
#
#   tmpfs <path>             用空 tmpfs 覆盖目录，物理隐藏整个目录
#   ro-bind <src> <path>     将 <path> 绑定到 <src> 只读（如 <src>=/dev/null）
#   ro-bind-self <path>      将 <path> 绑定到自身只读（可见但不可修改）
#
# <path> 相对于 $WORKSPACE_ROOT，支持尾部 glob 展开。路径中不要含空格。

# 源码目录：完全隐藏
tmpfs core/src

# git 元数据：允许读（git log/status/diff 可用），禁止写
ro-bind-self .git

# 密钥文件：内容置空
ro-bind /dev/null .env
ro-bind /dev/null .env.*
